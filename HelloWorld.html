<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Hello World - 经典问候</title>
    <style>
        /* 全局样式重置与优雅基础设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 优雅渐变背景，营造现代感但保持简洁 */
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* 主卡片容器 – 柔和圆角，细腻阴影 */
        .hello-card {
            background-color: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(0px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2), 0 2px 5px rgba(0, 0, 0, 0.02);
            padding: 2.5rem 2rem;
            text-align: center;
            max-width: 650px;
            width: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(255,255,255,0.4);
        }

        .hello-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.25);
        }

        /* 主标题 "Hello World" 艺术字 */
        .greeting {
            font-size: clamp(2.8rem, 10vw, 5.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(120deg, #1e293b, #2c3e66, #1e40af);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 2px 4px 12px rgba(0,0,0,0.05);
            margin-bottom: 0.75rem;
            line-height: 1.2;
        }

        /* 亲切的副文本或描述 */
        .sub-message {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-top: 0.5rem;
            margin-bottom: 1.8rem;
            font-weight: 450;
            border-bottom: 1px dashed #cbd5e1;
            display: inline-block;
            padding-bottom: 0.3rem;
        }

        /* 增加一个可爱的装饰表情或动态元素 */
        .icon-wave {
            font-size: 2.8rem;
            display: inline-block;
            animation: gentleWave 1.8s infinite ease-in-out;
            margin-bottom: 0.5rem;
        }

        @keyframes gentleWave {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(8deg) scale(1.1);}
            75% { transform: rotate(-6deg) scale(1.05);}
            100% { transform: rotate(0deg) scale(1);}
        }

        /* 现代信息卡片区域，展示Hello World背后的精神 */
        .info-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0 1.2rem;
        }

        .info-item {
            background: #f8fafc;
            border-radius: 1.8rem;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #0f172a;
            box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.2), 0 1px 2px rgba(0,0,0,0.02);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .info-item:hover {
            background: #ffffff;
            box-shadow: inset 0 0 0 1px #94a3b8, 0 4px 8px rgba(0,0,0,0.05);
            transform: scale(1.02);
        }

        /* 时间日期模块 - 增加一点动态真实感 */
        .live-clock {
            margin-top: 1.8rem;
            font-family: 'JetBrains Mono', monospace, system-ui;
            font-size: 0.9rem;
            background: #eef2ff;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #1e293b;
            font-weight: 500;
            border: 1px solid #cbdff2;
            backdrop-filter: blur(2px);
        }

        /* 趣味按钮 (可选交互) */
        .action-btn {
            margin-top: 2rem;
            background: none;
            border: none;
            font-size: 0.9rem;
            font-weight: 500;
            color: #3b6ea0;
            cursor: pointer;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            transition: all 0.2s;
            background-color: #eef2ff;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .action-btn:hover {
            background-color: #d9e4f5;
            color: #0f3b5c;
            transform: translateY(-2px);
        }

        .action-btn:active {
            transform: translateY(1px);
        }

        /* 底部极简版权 */
        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: #5a6e85;
            opacity: 0.7;
        }

        /* 响应式微调 */
        @media (max-width: 480px) {
            .hello-card {
                padding: 1.5rem;
            }
            .info-item {
                font-size: 0.75rem;
                padding: 0.4rem 1rem;
            }
            .sub-message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="hello-card">
        <!-- 活泼的小手势动画 -->
        <div class="icon-wave">👋✨</div>
        
        <!-- 核心问候: 经典的 Hello World -->
        <h1 class="greeting">Hello, World!</h1>
        
        <!-- 一个优雅的短语 / 表达欢迎 -->
        <div class="sub-message">
            🌍 欢迎来到代码的起点
        </div>

        <!-- 展示一些有趣的 "Hello World" 文化小卡片 -->
        <div class="info-grid">
            <span class="info-item">💡 经典的第一行代码</span>
            <span class="info-item">🚀 开启编程之旅</span>
            <span class="info-item">🌟 简洁 · 纯粹 · 无限可能</span>
        </div>

        <!-- 实时动态显示日期和时间 (给页面一点活气) -->
        <div class="live-clock" id="liveClock">
            🕒 加载中...
        </div>

        <!-- 一个微交互按钮，点击后展示控制台问候/提示，但不干扰体验 -->
        <button class="action-btn" id="greetBtn">
            🎉 点我获得惊喜问候
        </button>

        <div class="footer-note">
            Hello World — 每一个伟大应用的初心
        </div>
    </div>

    <script>
        // 封装一个优雅的实时时钟更新函数，展示当前日期与时间 (只为了生动)
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[now.getDay()];
            
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? '下午' : '上午';
            // 转换为12小时制显示更友好
            let displayHour = hours % 12;
            displayHour = displayHour === 0 ? 12 : displayHour;
            
            const timeStr = `${ampm} ${displayHour}:${minutes}:${seconds}`;
            const dateStr = `${year}年${month}月${day}日 ${weekday}`;
            
            const clockElement = document.getElementById('liveClock');
            if (clockElement) {
                clockElement.innerHTML = `📅 ${dateStr}  🕘 ${timeStr}`;
            }
        }
        
        // 初始化时钟并每秒更新
        updateClock();
        setInterval(updateClock, 1000);
        
        // 惊喜按钮逻辑 —— 显示一个可爱但又符合 "Hello World" 主题的弹窗通知或控制台输出
        const greetButton = document.getElementById('greetBtn');
        if (greetButton) {
            greetButton.addEventListener('click', () => {
                // 多种惊喜反馈方式，不使用繁杂弹窗影响体验，优雅提示然后控制台输出经典
                // 创建一个临时toast风格消息 (小而美)
                const toast = document.createElement('div');
                toast.innerText = '🌍✨ Hello World！ 编程星河因你闪耀 ✨🌏';
                toast.style.position = 'fixed';
                toast.style.bottom = '20px';
                toast.style.left = '50%';
                toast.style.transform = 'translateX(-50%)';
                toast.style.backgroundColor = '#1e293bc9';
                toast.style.backdropFilter = 'blur(12px)';
                toast.style.color = '#f1f5f9';
                toast.style.padding = '10px 20px';
                toast.style.borderRadius = '40px';
                toast.style.fontSize = '0.9rem';
                toast.style.fontWeight = '500';
                toast.style.fontFamily = 'system-ui, sans-serif';
                toast.style.zIndex = '9999';
                toast.style.boxShadow = '0 8px 20px rgba(0,0,0,0.2)';
                toast.style.border = '1px solid rgba(255,255,255,0.2)';
                toast.style.pointerEvents = 'none';
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.2s ease';
                document.body.appendChild(toast);
                
                // 淡入淡出效果
                setTimeout(() => { toast.style.opacity = '1'; }, 10);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => {
                        if (toast.parentNode) toast.parentNode.removeChild(toast);
                    }, 300);
                }, 2200);
                
                // 同时在控制台打印有趣的经典问候，致敬Hello World传统
                console.log('%c✨ Hello World! ✨', 'color: #2c6e9e; font-size: 16px; font-weight: bold;');
                console.log('%c你好，世界！ 从这行代码开始，探索无限可能 🚀', 'color: #3b6ea0;');
                console.log('“Hello World” 是每一位开发者的浪漫起点。');
            });
        }
        
        // 添加额外的优雅效果: 鼠标划过小卡片区域时，控制台不做干扰，但页面已经具备动态美感
        // 可选: 在页面加载完成时在控制台输出欢迎信息 (低调)
        window.addEventListener('load', () => {
            console.log('✨ 页面已加载 — 经典 Hello World 呈现 ✨');
            // 小彩蛋： 动态改变标题闪烁 (极简)
            let originalTitle = document.title;
            let counter = 0;
            // 轻量级标题闪烁两次，增加友好活泼感 (之后恢复)
            const titleInterval = setInterval(() => {
                if (counter >= 4) {
                    clearInterval(titleInterval);
                    document.title = originalTitle;
                    return;
                }
                document.title = counter % 2 === 0 ? '👋 Hello World' : '🌍 经典问候';
                counter++;
            }, 500);
            // 3秒后强制还原标题（以防定时器没清理干净）
            setTimeout(() => {
                if (document.title !== originalTitle) {
                    document.title = originalTitle;
                }
                clearInterval(titleInterval);
            }, 2500);
        });
        
        // 附加一个更美观的特性: 点击任意.info-item也进行友好的提示(但只控制台，保持清爽)
        const infoItems = document.querySelectorAll('.info-item');
        infoItems.forEach(item => {
            item.addEventListener('click', () => {
                const text = item.innerText;
                console.log(`ℹ️ 你点击了: "${text}" —  Hello World 无处不在！`);
                // 极轻提示无侵入
            });
        });
        
        // 确保移动端触摸优化，避免任何默认冲突
        if ('ontouchstart' in window) {
            document.body.style.touchAction = 'manipulation';
        }
    </script>
</body>
</html>
